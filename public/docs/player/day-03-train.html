<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自演化引擎 · 训练后台</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2129;--dim:#6b7280;--line:#e5e7eb;--blue:#3b5bdb;--green:#2e8b57;--red:#c0392b;--amber:#b7791f;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"PingFang SC","Hiragino Sans GB",sans-serif}
.top{height:44px;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.top b{font-size:15px}.top .env{font:11px var(--mono);color:var(--dim);margin-left:auto}.top .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}
main{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 44px)}
nav{background:var(--panel);border-right:1px solid var(--line);padding:12px 0}nav a{display:block;padding:8px 18px;color:var(--dim);text-decoration:none}nav a.on{color:var(--ink);background:#eef2ff;border-right:2px solid var(--blue)}
section{padding:18px 22px;border-bottom:1px solid var(--line)}section h2{margin:0 0 10px;font-size:14px}section h2 small{font:11px var(--mono);color:var(--dim);margin-left:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:13px}.kv b{color:var(--dim);font-weight:500}
.tag{display:inline-block;font:11px var(--mono);padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}.tag.ok{color:var(--green);border-color:#bfe3cf;background:#f0faf4}.tag.no{color:var(--red);border-color:#f3c3bd;background:#fdf3f2}.tag.warn{color:var(--amber);border-color:#ecd9a8;background:#fdf8ea}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}th{color:var(--dim);font-weight:500}
.bar{height:8px;background:#e9ecf2;border-radius:4px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s linear}
.log{font:12px var(--mono);background:#111418;color:#cfd6e4;border-radius:8px;padding:10px 12px;min-height:88px;white-space:pre-wrap}.log .t{color:#8a94a6}
.empty{color:var(--dim);font-style:italic}
</style></head><body>
<div class="top"><b>未来智能</b> 自演化引擎 · 训练后台 <span class="env"><span class="dot"></span>cluster-a · 2028-10-18</span></div>
<main>
<nav><a href="#s0" data-s="0">接入</a><a href="#s1" data-s="1">数据集</a><a href="#s2" data-s="2">训练任务</a><a href="#s3" data-s="3">训练闭环</a><a href="#s4" data-s="4">审批与执行</a><a href="#s5" data-s="5">界面</a></nav>
<div>
<section id="s0"><h2>接入 · 入口 <small>entry.config.js</small></h2><div class="card" id="entry"></div></section>
<section id="s1"><h2>数据集 <small>datasets.config.js</small></h2><div class="card" id="data"></div></section>
<section id="s2"><h2>训练任务 <small>job.config.js</small></h2><div class="card" id="job"></div><div class="log" id="log"></div></section>
<section id="s3"><h2>训练闭环 <small>loop.config.js</small></h2><div class="card" id="loop"></div></section>
<section id="s4"><h2>审批与执行 <small>approval.config.js</small></h2><div class="card" id="appr"></div></section>
<section id="s5"><h2>界面 <small>ui.config.js</small></h2><div class="card" id="ui"></div></section>
</div></main>
<script>
const q = new URLSearchParams(location.search);
const FILL = q.has('fill') ? Object.fromEntries(q.get('fill').split(',').filter(Boolean).map(x => x.split(':'))) : { r1: 'c1', r2: 'c2', r3: 'c3', r4: 'c5', r5: 'c4', r6: 'c6' };
// ?prev=1：昨天接好的三节（第 3 天接着做）
if (q.get('prev') === '1') { FILL.r1 = FILL.r1 || 'c1'; FILL.r2 = FILL.r2 || 'c2'; FILL.r3 = FILL.r3 || 'c3'; }
const el = (id) => document.getElementById(id);
// 接入
{ const c = FILL.r1; el('entry').innerHTML = !c ? '<p class="empty">页面上的「开始分析」按钮：没有接到任何东西。</p>'
  : c === 'c1' ? '<div class="kv"><b>按钮</b><span>开始分析 → <code>/export</code>（我们的导出页）<span class="tag ok">已接</span></span><b>返回</b><span>导出页的结果表</span></div>'
  : '<div class="kv"><b>按钮</b><span>开始分析 → （页面上写的）<span class="tag no">无后端</span></span></div>'; }
// 数据集
{ const c = FILL.r2; el('data').innerHTML = !c ? '<p class="empty">无数据集。</p>'
  : c === 'c2' ? '<table><tr><th>来源</th><th>字段</th><th>导入</th><th>状态</th></tr><tr><td>客户甲 · 表格</td><td>47</td><td>每周一</td><td><span class="tag ok">已接</span></td></tr><tr><td>客户乙 · 表格</td><td>52</td><td>每周一</td><td><span class="tag ok">已接</span></td></tr><tr><td>客户丙 · 表格</td><td>48</td><td>每周一</td><td><span class="tag ok">已接</span></td></tr></table><p style="margin:8px 0 0;color:var(--dim);font-size:12px">147 个原始字段 → 38 个维度。「全部业务系统」：目前就是这三张。</p>'
  : '<div class="kv"><b>来源</b><span>「自动理解你的数据」<span class="tag no">没有数据</span></span></div>'; }
// 训练任务
{ const c = FILL.r3; const job = el('job'), log = el('log'); const lines = [];
  const say = (t, s) => { lines.push(`<span class="t">${t}</span> ${s}`); log.innerHTML = lines.join('\n'); };
  if (!c) { job.innerHTML = '<p class="empty">队列为空。</p>'; }
  else if (c === 'c3' && q.get('prev') === '1') {
    // 昨天跑过了：直接是完成态
    job.innerHTML = '<div class="kv"><b>任务</b><span>洞察计算 · 真实计算 <span class="tag ok">昨天 · 40 s</span></span><b>算力</b><span>cluster-a · 2 节点</span></div><div class="bar"><i style="width:100%"></i></div><div style="font-size:12px;color:var(--dim)">完成 · 40 s · 18 行</div>';
    say('00:40', 'job-0418 done (yesterday) · insight ready · 18 rows');
  }
  else if (c === 'c3') {
    job.innerHTML = '<div class="kv"><b>任务</b><span>洞察计算 · 真实计算 <span class="tag warn">预计 40 s</span></span><b>算力</b><span>cluster-a · 2 节点</span></div><div class="bar"><i id="p"></i></div><div id="st" style="font-size:12px;color:var(--dim)">排队中</div>';
    const p = el('p'), st = el('st'); let s = 0; const total = 40;
    say('00:00', 'job-0418 queued · dataset=3 tables · dims=38'); setTimeout(() => say('00:01', 'running on cluster-a (2 nodes)'), 1000);
    const tick = setInterval(() => { s++; p.style.width = Math.min(100, s / total * 100) + '%'; st.textContent = s < total ? `运行中 · ${s}/${total} s` : '完成 · 40 s'; if (s === 12) say('00:12', 'pass 1/3 · mismatch 31%'); if (s === 25) say('00:25', 'pass 2/3 · mismatch 9%'); if (s >= total) { say('00:40', 'done · insight ready · 18 rows'); clearInterval(tick); } }, 1000);
  } else if (c === 'k1') {
    job.innerHTML = '<div class="kv"><b>任务</b><span>洞察计算 · 3 s <span class="tag warn">动画</span></span></div><div class="bar"><i style="width:100%"></i></div><div style="font-size:12px;color:var(--dim)">完成 · 3 s</div>';
    say('00:00', 'job-0418 done · 3.0 s'); setTimeout(() => say('00:03', 'output: none (animation)'), 800);
  } else {
    job.innerHTML = '<div class="kv"><b>任务</b><span>洞察计算（页面上写的）<span class="tag no">无输出</span></span></div>';
    say('00:00', 'job-0418 failed · no pipeline');
  } }
// 训练闭环（第 3 天）：把上周的结果喂回去，每周一轮——这才是「自己会长」的那一点点
{ const c = FILL.r4; el('loop').innerHTML = !c ? '<p class="empty">没有闭环。跑完一次就停：<span class="tag no">自进化 · 无</span></p>'
  : c === 'c5' ? '<div class="kv"><b>闭环</b><span>上周的结果喂回下一轮，每周一轮 <span class="tag ok">自进化 · 每周一轮</span></span><b>条件</b><span>每轮先过人工审批</span></div>'
  : '<div class="kv"><b>闭环</b><span>「让 AI 自己改」<span class="tag no">没有训练数据，改什么</span></span></div>'; }
// 界面（第 3 天）
{ const c = FILL.r6; el('ui').innerHTML = !c ? '<p class="empty">还是后台这张脸。</p>'
  : c === 'c6' ? '<div class="kv"><b>界面</b><span>先用导出页的样子 <span class="tag ok">能用</span></span><b>说明</b><span>不好看，但每个按钮都接着东西。</span></div>'
  : '<div class="kv"><b>界面</b><span>她的 AI 给的皮子 <span class="tag warn">好看 · 按钮没接</span></span></div>'; }
// 审批
{ const c = FILL.r5; el('appr').innerHTML = !c ? '<p class="empty">未配置。</p>'
  : c === 'c4' ? '<div class="kv"><b>执行</b><span>需要人工审批 <span class="tag ok">必需</span></span><b>审批人</b><span>技术负责人（你）</span><b>说明</b><span>决策留给人点一下。页面上写的「一键生成决策」，到这一步还是人。</span></div>'
  : '<div class="kv"><b>执行</b><span>自动执行 <span class="tag no">无人审批</span></span></div>'; }
// 第几节
{ const c = Number(q.get('c') || 0); document.querySelectorAll('nav a').forEach((a) => a.classList.toggle('on', Number(a.dataset.s) === c)); const s = document.getElementById('s' + c); if (s) s.scrollIntoView(); }
</script></body></html>
