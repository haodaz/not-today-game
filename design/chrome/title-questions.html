<!doctype html><html lang="zh"><meta charset="utf-8"><title>标题页 · 问题卡片</title>
<link rel="stylesheet" href="fonts.css"><style>
html,body{margin:0;background:#000}
.stage{position:relative;width:1600px;height:900px;overflow:hidden;font-family:var(--zh);color:#1d2129}
.bg{position:absolute;inset:0;background:url(room.jpg) center/cover;transform:scale(1.9) translate(4%,8%);filter:brightness(.55) saturate(.85)}
.vig{position:absolute;inset:0;background:radial-gradient(90% 80% at 50% 45%,transparent 40%,rgba(0,0,0,.55) 100%)}
.logo{position:absolute;left:104px;top:110px;width:600px;opacity:.35;filter:drop-shadow(0 2px 18px rgba(0,0,0,.6))}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:560px;background:rgba(236,231,222,.88);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.6);border-radius:8px;padding:28px 34px 26px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.card h2{margin:0 0 22px;font-size:20px;font-weight:500;letter-spacing:.08em}
.row{display:flex;align-items:center;gap:12px;font-size:17px;margin:14px 0}
.row.done{opacity:.5}
.row label{width:150px;flex:0 0 auto}
.row input{flex:1;background:transparent;border:0;border-bottom:1px solid #8a7f70;font:inherit;padding:6px 2px;outline:0;color:#1d2129}
.row .d{width:32px;height:32px;border:1px solid #8a7f70;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
.start{margin-top:24px;width:100%;padding:11px 0;text-align:center;border:1px solid #2a2622;border-radius:4px;font-size:16px;letter-spacing:.3em;text-indent:.3em;opacity:.35}
.esc{position:absolute;left:34px;bottom:-30px;font-size:12px;color:rgba(239,233,223,.6);letter-spacing:.1em}
</style>
<div class="stage">
  <div class="bg"></div><div class="vig"></div>
  <img class="logo" src="logo.svg" alt="NOT TODAY">
  <div class="card">
    <h2>这是谁的故事？</h2>
    <div class="row done"><label>名字</label><input value="林一"><span class="d">🎲</span></div>
    <div class="row done"><label>家里人怎么称呼你？</label><input value="一一"><span class="d">🎲</span></div>
    <div class="row"><label>老板怎么叫你？</label><input placeholder=""><span class="d">🎲</span></div>
    <div class="start">开始</div>
    <div class="esc">Esc 返回</div>
  </div>
</div>
