<!doctype html><html lang="zh"><meta charset="utf-8"><title>标题页 · 问题</title>
<link rel="stylesheet" href="fonts.css"><style>
html,body{margin:0;background:#000}
.stage{position:relative;width:1600px;height:900px;overflow:hidden;font-family:var(--zh);color:#efe9df}
.bg{position:absolute;inset:-4%;background:url(room.jpg) center/cover;filter:brightness(.42) saturate(.8)}
.vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 50%,transparent 40%,rgba(0,0,0,.55) 100%)}
.logo{position:absolute;left:104px;top:110px;width:600px;filter:drop-shadow(0 2px 18px rgba(0,0,0,.6))}
.q{position:absolute;left:112px;top:300px;display:flex;flex-direction:column;gap:26px;width:520px}
.row{display:flex;align-items:center;gap:14px;font-size:18px;letter-spacing:.06em}
.row.done{opacity:.55}
.row input{flex:1;background:transparent;border:0;border-bottom:1.5px solid rgba(239,233,223,.6);color:#efe9df;font:inherit;padding:6px 2px;outline:0}
.row .d{width:34px;height:34px;border:1.5px solid rgba(239,233,223,.6);display:flex;align-items:center;justify-content:center;font-size:16px}
.row .g{display:flex;gap:10px}.row .g span{border:1.5px solid rgba(239,233,223,.6);padding:6px 16px;letter-spacing:.2em}.row .g span.on{background:#efe9df;color:#111}
.start{margin-top:14px;width:260px;padding:12px 0;text-align:center;border:1.5px solid rgba(239,233,223,.3);font-size:18px;letter-spacing:.3em;text-indent:.3em;opacity:.4}
.esc{position:absolute;left:112px;bottom:40px;font-size:12px;letter-spacing:.1em;color:rgba(239,233,223,.55)}
</style>
<div class="stage">
  <div class="bg"></div><div class="vig"></div>
  <img class="logo" src="logo.svg" alt="NOT TODAY">
  <div class="q">
    <div class="row done"><span>这是谁的故事？</span><input value="林一"><span class="d">🎲</span></div>
    <div class="row done"><span>家里人怎么称呼你？</span><input value="一一"><span class="d">🎲</span></div>
    <div class="row"><span>老板怎么叫你？</span><input placeholder=""><span class="d">🎲</span></div>
    <div class="start">开始</div>
  </div>
  <div class="esc">Esc 返回</div>
</div>
